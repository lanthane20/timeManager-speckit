# Application
spring.application.name=timemanager

# Port
server.port=${SERVER_PORT:8080}

# OAuth2 Resource Server
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:https://accounts.google.com}

# Base de données (variables d'environnement — voir .env.example)
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/timemanager}
spring.datasource.username=${DB_USERNAME:timemanager}
spring.datasource.password=${DB_PASSWORD:}

# Email (EF-036) — désactivable globalement via NOTIFICATION_ENABLED
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
timemanager.notification.enabled=${NOTIFICATION_ENABLED:true}
timemanager.notification.from=${NOTIFICATION_FROM:noreply@timemanager.fr}

# URL du frontend, utilisée dans les liens des emails
timemanager.app.base-url=${APP_BASE_URL:http://localhost:4200}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.open-in-view=false

# Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Logging (texte en dev, JSON en prod via logback-spring.xml)
logging.level.fr.timemanager=${LOG_LEVEL_FR_TIMEMANAGER:INFO}
