name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Backend — Java 25 / Maven
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      - name: Lint — Checkstyle + Google Java Format
        run: ./mvnw spotless:check checkstyle:check --no-transfer-progress

      # install publie les modules dans le dépôt local : les étapes suivantes
      # (-pl sans -am) en dépendent sur un runner vierge.
      - name: Tests unitaires
        run: ./mvnw install -pl .,domain,application --no-transfer-progress

      - name: Tests d'intégration (Testcontainers + MariaDB)
        run: ./mvnw install -pl infrastructure --no-transfer-progress

      - name: Tests contrôleurs (MockMvc)
        run: ./mvnw test -pl api --no-transfer-progress

      - name: Audit sécurité OWASP
        run: ./mvnw dependency-check:check --no-transfer-progress
        continue-on-error: true

      - name: Rapport Allure
        if: always()
        run: ./mvnw allure:aggregate --no-transfer-progress
        continue-on-error: true

      - name: Upload rapport Allure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/site/allure-maven-plugin/

  frontend:
    name: Frontend — Node.js / Angular
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Lint (ESLint + Prettier)
        working-directory: frontend
        run: npm run lint

      - name: Tests unitaires
        working-directory: frontend
        run: npm test -- --watch=false

      - name: Audit sécurité npm
        working-directory: frontend
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Build production
        working-directory: frontend
        run: npm run build -- --configuration=production

      - name: Installer les navigateurs Playwright
        working-directory: frontend
        run: npm run e2e:install

      - name: Tests end-to-end (Playwright)
        working-directory: frontend
        # Les scénarios sont ignorés tant que les jetons de démonstration ne sont pas fournis.
        env:
          CI: "true"
          E2E_BASE_URL: http://localhost:4200
          E2E_TOKEN_SALARIE: ${{ secrets.E2E_TOKEN_SALARIE }}
          E2E_TOKEN_MANAGER: ${{ secrets.E2E_TOKEN_MANAGER }}
          E2E_TOKEN_RH: ${{ secrets.E2E_TOKEN_RH }}
        run: |
          npx http-server dist/frontend/browser -p 4200 --proxy http://localhost:4200? &
          npx wait-on http://localhost:4200 --timeout 60000
          npm run e2e

      - name: Upload rapport Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
