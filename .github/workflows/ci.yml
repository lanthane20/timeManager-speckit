name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Backend — Java 25 / Maven
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      - name: Lint — Checkstyle + Google Java Format
        run: ./mvnw spotless:check checkstyle:check --no-transfer-progress

      # install publie les modules dans le dépôt local : les étapes suivantes
      # (-pl sans -am) en dépendent sur un runner vierge.
      - name: Tests unitaires
        run: ./mvnw install -pl .,domain,application --no-transfer-progress

      - name: Tests d'intégration (Testcontainers + MariaDB)
        run: ./mvnw install -pl infrastructure --no-transfer-progress

      - name: Tests contrôleurs (MockMvc)
        run: ./mvnw test -pl api --no-transfer-progress

      - name: Audit sécurité OWASP
        run: ./mvnw dependency-check:check --no-transfer-progress
        continue-on-error: true

      - name: Rapport Allure
        if: always()
        run: ./mvnw allure:aggregate --no-transfer-progress
        continue-on-error: true

      - name: Upload rapport Allure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/site/allure-maven-plugin/

  frontend:
    name: Frontend — Node.js / Angular
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Lint (ESLint + Prettier)
        working-directory: frontend
        run: npm run lint

      - name: Tests unitaires
        working-directory: frontend
        run: npm test -- --watch=false

      - name: Audit sécurité npm
        working-directory: frontend
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Build production
        working-directory: frontend
        run: npm run build -- --configuration=production

      # Le build doit embarquer environment.prod.ts, dont `npm run inject-env` remplace les marqueurs.
      - name: Vérifier l'environnement de production
        working-directory: frontend
        run: grep -lF '${GOOGLE_CLIENT_ID}' dist/frontend/browser/*.js

  e2e:
    name: End-to-end — Playwright / Keycloak + backend + MariaDB
    runs-on: ubuntu-latest

    # Application complète : MariaDB, backend Spring Boot et frontend. Un Keycloak de test remplace
    # Google : les tests se connectent réellement (redirection, /callback, PKCE) avec les comptes
    # de démonstration de frontend/e2e/keycloak. Aucun secret ni compte Google n'est nécessaire.
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: timemanager
          MARIADB_USER: timemanager
          MARIADB_PASSWORD: timemanager
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Construire le backend
        run: ./mvnw package -pl api -am -DskipTests --no-transfer-progress

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Installer les navigateurs Playwright
        working-directory: frontend
        run: npm run e2e:install

      # Les conteneurs de service n'acceptent pas d'arguments : Keycloak est lancé à la main.
      - name: Démarrer Keycloak (fournisseur d'identité de test)
        run: |
          mkdir -p "$RUNNER_TEMP/e2e"
          docker run -d --name keycloak -p 8180:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            -v "$GITHUB_WORKSPACE/frontend/e2e/keycloak:/opt/keycloak/data/import:ro" \
            keycloak/keycloak:26.4.0 start-dev --import-realm
          timeout 180 bash -c 'until curl -sf http://localhost:8180/realms/timeplanning/.well-known/openid-configuration > /dev/null; do sleep 2; done'

      - name: Démarrer le backend
        env:
          DB_URL: jdbc:mariadb://localhost:3306/timemanager
          DB_USERNAME: timemanager
          DB_PASSWORD: timemanager
          NOTIFICATION_ENABLED: "false"
          MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
          # Même mécanisme qu'avec Google : seul l'émetteur change.
          SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8180/realms/timeplanning
        run: |
          nohup java -jar api/target/api-1.0.0-SNAPSHOT.jar > "$RUNNER_TEMP/e2e/backend.log" 2>&1 &
          timeout 180 bash -c 'until curl -sf http://localhost:8080/actuator/health; do sleep 2; done'

      - name: Charger les comptes de démonstration
        run: |
          docker exec -i ${{ job.services.mariadb.id }} \
            mariadb -utimemanager -ptimemanager timemanager < frontend/e2e/fixtures/seed.sql

      - name: Démarrer le frontend
        working-directory: frontend
        run: |
          nohup npm run start:e2e > "$RUNNER_TEMP/e2e/frontend.log" 2>&1 &
          timeout 180 bash -c 'until curl -sf http://localhost:4200 > /dev/null; do sleep 2; done'

      - name: Tests end-to-end (Playwright)
        working-directory: frontend
        env:
          CI: "true"
          E2E_BASE_URL: http://localhost:4200
          E2E_KEYCLOAK_URL: http://localhost:8180
        run: npm run e2e

      - name: Journal Keycloak
        if: failure()
        run: docker logs keycloak > "$RUNNER_TEMP/e2e/keycloak.log" 2>&1

      - name: Upload rapport Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            ${{ runner.temp }}/e2e/*.log
