name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Backend — Java 25 / Maven
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      - name: Lint — Checkstyle + Google Java Format
        run: ./mvnw spotless:check checkstyle:check --no-transfer-progress

      # install publie les modules dans le dépôt local : les étapes suivantes
      # (-pl sans -am) en dépendent sur un runner vierge.
      - name: Tests unitaires
        run: ./mvnw install -pl .,domain,application --no-transfer-progress

      - name: Tests d'intégration (Testcontainers + MariaDB)
        run: ./mvnw install -pl infrastructure --no-transfer-progress

      - name: Tests contrôleurs (MockMvc)
        run: ./mvnw test -pl api --no-transfer-progress

      - name: Audit sécurité OWASP
        run: ./mvnw dependency-check:check --no-transfer-progress
        continue-on-error: true

      - name: Rapport Allure
        if: always()
        run: ./mvnw allure:aggregate --no-transfer-progress
        continue-on-error: true

      - name: Upload rapport Allure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/site/allure-maven-plugin/

  frontend:
    name: Frontend — Node.js / Angular
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Lint (ESLint + Prettier)
        working-directory: frontend
        run: npm run lint

      - name: Tests unitaires
        working-directory: frontend
        run: npm test -- --watch=false

      - name: Audit sécurité npm
        working-directory: frontend
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Build production
        working-directory: frontend
        run: npm run build -- --configuration=production

  e2e:
    name: End-to-end — Playwright / backend + MariaDB
    runs-on: ubuntu-latest

    # Application complète : MariaDB, backend Spring Boot et frontend. Les jetons d'accès sont
    # signés par les tests avec une paire de clés jetable générée à chaque run : aucun secret
    # ni compte Google n'est nécessaire.
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: timemanager
          MARIADB_USER: timemanager
          MARIADB_PASSWORD: timemanager
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Construire le backend
        run: ./mvnw package -pl api -am -DskipTests --no-transfer-progress

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Installer les navigateurs Playwright
        working-directory: frontend
        run: npm run e2e:install

      - name: Générer la paire de clés de signature des jetons de test
        run: |
          mkdir -p "$RUNNER_TEMP/e2e"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$RUNNER_TEMP/e2e/private.pem"
          openssl rsa -in "$RUNNER_TEMP/e2e/private.pem" -pubout -out "$RUNNER_TEMP/e2e/public.pem"

      - name: Démarrer le backend
        env:
          DB_URL: jdbc:mariadb://localhost:3306/timemanager
          DB_USERNAME: timemanager
          DB_PASSWORD: timemanager
          NOTIFICATION_ENABLED: "false"
          MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
          # Sans issuer-uri, Spring valide les jetons avec la seule clé publique de test.
          SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ""
          SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_PUBLIC_KEY_LOCATION: file:${{ runner.temp }}/e2e/public.pem
        run: |
          nohup java -jar api/target/api-1.0.0-SNAPSHOT.jar > "$RUNNER_TEMP/e2e/backend.log" 2>&1 &
          timeout 180 bash -c 'until curl -sf http://localhost:8080/actuator/health; do sleep 2; done'

      - name: Charger les comptes de démonstration
        run: |
          docker exec -i ${{ job.services.mariadb.id }} \
            mariadb -utimemanager -ptimemanager timemanager < frontend/e2e/fixtures/seed.sql

      - name: Démarrer le frontend
        working-directory: frontend
        run: |
          nohup npm start > "$RUNNER_TEMP/e2e/frontend.log" 2>&1 &
          timeout 180 bash -c 'until curl -sf http://localhost:4200 > /dev/null; do sleep 2; done'

      - name: Tests end-to-end (Playwright)
        working-directory: frontend
        env:
          CI: "true"
          E2E_BASE_URL: http://localhost:4200
          E2E_JWT_PRIVATE_KEY: ${{ runner.temp }}/e2e/private.pem
        run: npm run e2e

      - name: Upload rapport Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            ${{ runner.temp }}/e2e/*.log
