name: Deploy

# Déploiement continu sur le serveur privé (runner auto-hébergé, aucun port entrant) :
# après une CI verte sur master, les images sont publiées sur GHCR puis le runner du serveur
# met à jour les conteneurs. Lancement manuel possible, avec un tag existant pour revenir en arrière.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag d'image à déployer (SHA d'un commit déjà publié) ; vide = construire master"
        required: false
        default: ""

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  images:
    name: Images Docker (GHCR)
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push')
      || (github.event_name == 'workflow_dispatch' && inputs.tag == '')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Tag des images
        id: tag
        run: echo "tag=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      - name: Construire le jar backend
        run: ./mvnw package -pl api -am -DskipTests --no-transfer-progress

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/lanthane20/timemanager-speckit-backend:${{ steps.tag.outputs.tag }}
            ghcr.io/lanthane20/timemanager-speckit-backend:latest

      - name: Image frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/lanthane20/timemanager-speckit-frontend:${{ steps.tag.outputs.tag }}
            ghcr.io/lanthane20/timemanager-speckit-frontend:latest

  deploy:
    name: Déploiement sur le serveur
    needs: images
    if: >-
      always() && !cancelled()
      && (needs.images.result == 'success'
        || (github.event_name == 'workflow_dispatch' && inputs.tag != ''))
    runs-on: [self-hosted, timeplanning]
    # Approbation manuelle possible : Settings → Environments → production → Required reviewers.
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_DIR: /opt/timeplanning
      IMAGE_TAG: ${{ inputs.tag || needs.images.outputs.tag }}
    steps:
      - name: Checkout de la configuration
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || needs.images.outputs.tag }}
          sparse-checkout: docker/production

      - name: Mettre à jour la configuration
        run: |
          test -f "$DEPLOY_DIR/.env" || { echo "::error::$DEPLOY_DIR/.env manquant (voir docker/production/README.md)"; exit 1; }
          cp docker/production/docker-compose.yml "$DEPLOY_DIR/docker-compose.yml"
          mkdir -p "$DEPLOY_DIR/traefik"
          cp -r docker/production/traefik/dynamic "$DEPLOY_DIR/traefik/"

      - name: Connexion à GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Liquibase modifie le schéma au démarrage du backend : sauvegarde avant chaque déploiement.
      - name: Sauvegarder la base
        working-directory: /opt/timeplanning
        run: |
          mkdir -p backups
          if [ -n "$(docker compose ps -q --status running db)" ]; then
            docker compose exec -T db sh -c 'mariadb-dump -uroot -p"$MARIADB_ROOT_PASSWORD" --single-transaction timemanager' \
              | gzip > "backups/timemanager-$(date +%Y%m%d-%H%M%S).sql.gz"
          fi
          # Conserve les 14 sauvegardes les plus récentes.
          ls -1t backups/*.sql.gz 2>/dev/null | tail -n +15 | xargs -r rm --

      - name: Déployer
        working-directory: /opt/timeplanning
        run: |
          docker compose pull
          docker compose up -d --remove-orphans --wait --wait-timeout 300

      - name: Vérifier l'état du backend
        working-directory: /opt/timeplanning
        run: docker compose exec -T backend wget -qO- http://localhost:8080/actuator/health

      - name: Déconnexion de GHCR
        if: always()
        run: docker logout ghcr.io
