version: "3.9"

services:
  mariadb:
    image: mariadb:11.4
    container_name: timemanager-db
    environment:
      MARIADB_ROOT_PASSWORD: root_password_dev
      MARIADB_DATABASE: timemanager
      MARIADB_USER: timemanager
      MARIADB_PASSWORD: timemanager_dev
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3

  # Fournisseur d'identité des tests end-to-end (remplace Google) : docker compose --profile e2e up -d
  keycloak:
    image: keycloak/keycloak:26.4.0
    container_name: timemanager-keycloak
    profiles: ["e2e"]
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"
    volumes:
      - ../frontend/e2e/keycloak:/opt/keycloak/data/import:ro

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: timemanager-mail
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  mariadb_data:
