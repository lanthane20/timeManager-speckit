version: "3.9"

services:
  mariadb:
    image: mariadb:11.4
    container_name: timemanager-db
    environment:
      MARIADB_ROOT_PASSWORD: root_password_dev
      MARIADB_DATABASE: timemanager
      MARIADB_USER: timemanager
      MARIADB_PASSWORD: timemanager_dev
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: timemanager-mail
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  mariadb_data:
