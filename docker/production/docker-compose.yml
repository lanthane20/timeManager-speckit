# Production — TimePlanning derrière Traefik (HTTPS).
# Déployé par .github/workflows/deploy.yml dans /opt/timeplanning ; secrets dans .env (voir .env.example).
name: timeplanning

services:
  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=timeplanning_edge
      - --providers.file.directory=/etc/traefik/dynamic
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls=true
      # Let's Encrypt (serveur joignable depuis Internet sur le port 80) : décommenter, renseigner
      # ACME_EMAIL et remplacer `tls=true` ci-dessus par `tls.certresolver=letsencrypt`.
      # - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      # - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      # - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Lecture seule : Traefik ne fait que découvrir les conteneurs étiquetés.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./certs:/certs:ro
      - letsencrypt:/letsencrypt
    networks: [edge]

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: timemanager
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Réseau interne uniquement : la base n'est jamais exposée.
    networks: [internal]

  backend:
    image: ghcr.io/lanthane20/timemanager-speckit-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DB_URL: jdbc:mariadb://db:3306/timemanager
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      db:
        condition: service_healthy
    labels:
      - traefik.enable=true
      # Seule l'API est publiée : /actuator reste interne au réseau Docker.
      - traefik.http.routers.api.rule=Host(`${APP_HOST}`) && PathPrefix(`/api`)
      - traefik.http.routers.api.entrypoints=websecure
      - traefik.http.routers.api.middlewares=security-headers@file
      - traefik.http.services.api.loadbalancer.server.port=8080
    networks: [internal, edge]

  frontend:
    image: ghcr.io/lanthane20/timemanager-speckit-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      APP_BASE_URL: ${APP_BASE_URL}
    labels:
      - traefik.enable=true
      - traefik.http.routers.app.rule=Host(`${APP_HOST}`)
      - traefik.http.routers.app.entrypoints=websecure
      - traefik.http.routers.app.middlewares=security-headers@file
      - traefik.http.services.app.loadbalancer.server.port=80
    networks: [edge]

networks:
  edge:
  internal:
    internal: true

volumes:
  mariadb_data:
  letsencrypt:
