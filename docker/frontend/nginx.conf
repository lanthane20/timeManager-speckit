# SPA Angular : Traefik route /api vers le backend, Nginx ne sert que les fichiers statiques.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Fichiers versionnés par le build (hash dans le nom) : cache long.
  location ~* \.(?:js|css|woff2?|ttf|svg|png|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Routes Angular (/my-absences, /callback…) : toujours index.html, jamais mis en cache.
  location / {
    add_header Cache-Control "no-store";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    try_files $uri $uri/ /index.html;
  }
}
